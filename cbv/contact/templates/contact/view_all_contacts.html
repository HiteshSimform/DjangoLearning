<!-- contact/templates/contact/view_all_contacts.html -->

<h1>All Contact Submissions</h1>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for contact in contacts %}
        <tr>
            <td>{{ contact.name }}</td>
            <td>{{ contact.email }}</td>
            <td>{{ contact.message }}</td>
            <td>
                <a href="{% url 'update_contact' contact.pk %}">Edit</a> | 
                <a href="{% url 'delete_contact' contact.pk %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
