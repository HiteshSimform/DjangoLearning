<!-- contact/templates/contact/confirm_delete.html -->

<h1>Are you sure you want to delete this submission?</h1>
<p><strong>Name:</strong> {{ contact.name }}</p>
<p><strong>Email:</strong> {{ contact.email }}</p>
<p><strong>Message:</strong> {{ contact.message }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'view_all_contacts' %}"><button type="button">Cancel</button></a>
</form>
