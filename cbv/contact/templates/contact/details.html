<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show details of All</title>
</head>
<body>
    <ul>
        {% for item in items %}
            <li>{{ item.name }} - {{ item.email }}</li>
        {% empty %}
            <li>No items available.</li>
        {% endfor %}
    </ul>
</body>
</html>
